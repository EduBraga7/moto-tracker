  <!-- Motorcycle icon -->
  <g transform="translate(8, 8) scale(2)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Rear Wheel -->
    <circle cx="5.5" cy="17.5" r="3.5" stroke="#E11D48" stroke-width="2.2" />
    <!-- Front Wheel -->
    <circle cx="18.5" cy="17.5" r="3.5" stroke="#E11D48" stroke-width="2.2" />
